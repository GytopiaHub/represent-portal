<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI options: groups</title>
<!-- UI options for /groups: the groups in the database with their members in
     line order (SRS 6.2). Stock shadcn neutral dark theme. Group and stage
     names are public artist reference data (SEC-4); there is no crew data.
     Each preview includes the shared top bar. The previews are interactive.
     To record a choice, set CHOSEN below, e.g. {option:"A", date:"2026-11-23"}. -->
<style>
:root{--bg:#0d0d0f;--panel:#18181b;--ink:#ececec;--muted:#9a9a9a;--line:#2a2a2e;--ok:#4cc27e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px 40px}
.wrap{max-width:1320px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px}
h1{font-size:1.4rem;margin:0}.meta{color:var(--muted);font-size:13px}code{font:12.5px ui-monospace,Consolas,monospace;background:#ffffff10;padding:1px 6px;border-radius:4px}
.status{margin-left:auto;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.status.done{border-color:var(--ok);color:var(--ok)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:600;color:var(--muted);background:none;border:0;border-radius:7px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:#ffffff14;color:var(--ink)}
.badge{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#0d0d0f;background:var(--ok);border-radius:99px;padding:0 7px;vertical-align:1px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.note p{margin:0;color:var(--muted)}
.stage{display:flex;justify-content:center;overflow:hidden}.frame{position:relative;flex-shrink:0}
iframe{border:0;background:#000;border-radius:14px;box-shadow:0 0 0 1px var(--line),0 20px 60px #0008;transform-origin:top left;display:block}
.dims{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
</style></head><body><div class="wrap">
<header><h1>Groups</h1><span class="meta">Route <code>/groups</code> · Source <code>src/app/groups/page.tsx</code> · Data <code>groups</code>, <code>group_members</code></span><span class="status" id="status"></span></header>
<div class="bar"><div class="seg" id="tabs" role="group" aria-label="Option"></div>
<div class="seg" id="sizes" role="group" aria-label="Viewport"><button data-w="390" data-h="844">Phone</button><button data-w="1280" data-h="800">Desktop</button></div></div>
<div class="note" id="note"></div>
<div class="stage" id="stage"><div class="frame" id="frame"><iframe id="view" title="Option preview" sandbox="allow-scripts"></iframe></div></div>
<div class="dims" id="dims"></div>
</div>

<script type="text/plain" id="app-css">
:root{--radius:.625rem;--background:oklch(.145 0 0);--foreground:oklch(.985 0 0);--card:oklch(.205 0 0);--muted:oklch(.269 0 0);--muted-foreground:oklch(.708 0 0);--border:oklch(1 0 0/10%);--input:oklch(1 0 0/15%)}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--background);color:var(--foreground);font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ol,ul{margin:0}ol,ul{padding:0;list-style:none}a{color:inherit;text-decoration:none}button,input{font:inherit;color:inherit}
.nav{display:flex;align-items:center;gap:4px;padding:10px 16px;border-bottom:1px solid var(--border)}
.logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ff4d8d,#7a5cff);margin-right:10px;flex-shrink:0}
.nav a{padding:10px 12px;border-radius:8px;color:var(--muted-foreground);font-weight:500;min-height:44px;display:flex;align-items:center}
.nav a[aria-current]{color:var(--foreground);background:var(--muted)}
.page{max-width:1152px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px}
.title{font-size:24px;font-weight:700;letter-spacing:-.01em}.sub{color:var(--muted-foreground);font-size:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.mf{color:var(--muted-foreground)}.sm{font-size:13px}.xs{font-size:12px}
input.search{width:100%;max-width:360px;height:44px;border-radius:10px;border:1px solid var(--input);background:transparent;padding:0 12px}
input.search::placeholder{color:var(--muted-foreground)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;padding:2px 10px;font-size:13px}
.chip i{font-style:normal;color:var(--muted-foreground);font-size:11px}
mark{background:oklch(.985 0 0/20%);color:inherit;border-radius:3px}
.empty{padding:32px 0;text-align:center;color:var(--muted-foreground)}
/* A */
.gridA{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.gridA{grid-template-columns:repeat(2,1fr)}}@media(min-width:1024px){.gridA{grid-template-columns:repeat(3,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* B */
.acc{display:flex;flex-direction:column}
.acc button.row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:none;border:0;border-bottom:1px solid var(--border);padding:12px 4px;min-height:52px;cursor:pointer;text-align:left}
.acc .row b{font-weight:600}.acc .caret{color:var(--muted-foreground);transition:transform .15s}.acc .open .caret{transform:rotate(90deg)}
.acc ol{padding:8px 4px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 16px;border-bottom:1px solid var(--border)}
.acc li{display:flex;gap:8px}.acc li span{color:var(--muted-foreground);width:20px;text-align:right;font-variant-numeric:tabular-nums}
/* C */
.split{display:grid;gap:16px}@media(min-width:768px){.split{grid-template-columns:260px 1fr}}
.glist{display:flex;flex-direction:column;gap:2px}
.glist button{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-radius:8px;padding:10px 12px;min-height:44px;cursor:pointer;text-align:left}
.glist button[aria-pressed=true]{background:var(--muted)}.glist button span{color:var(--muted-foreground)}
.detail ol{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:14px}
.detail li{border:1px solid var(--border);border-radius:10px;padding:10px 12px}.detail li span{display:block;color:var(--muted-foreground);font-size:12px}
.back{background:none;border:0;color:var(--muted-foreground);padding:10px 0;min-height:44px;cursor:pointer}
@media(min-width:768px){.back{display:none}}
/* D */
.jump{display:flex;gap:2px;overflow-x:auto;padding-bottom:2px}
.jump a{min-width:36px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted-foreground);font-weight:600}
.jump a:hover{background:var(--muted);color:var(--foreground)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:500;color:var(--muted-foreground);text-align:left;padding:8px;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl td.n{white-space:nowrap;font-weight:600}.tbl td.c{text-align:right;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.letter td{padding-top:18px;font-size:12px;color:var(--muted-foreground);font-weight:600;border-bottom:0}
@media(max-width:639px){.tbl thead{display:none}.tbl tr.g{display:block;border-bottom:1px solid var(--border);padding:10px 0}.tbl tr.g td{display:block;border:0;padding:2px 0}.tbl td.c{text-align:left}}
/* E */
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:16px;font-weight:600;display:flex;align-items:baseline;gap:8px}
.lineup{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.lineup li{flex:0 0 108px;scroll-snap-align:start;border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.av{width:40px;height:40px;border-radius:50%;background:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--muted-foreground)}
.lineup .pos{font-size:11px;color:var(--muted-foreground)}.lineup .nm{font-size:13px;font-weight:500;line-height:1.3}
@media(min-width:1024px){.lineup{flex-wrap:wrap;overflow:visible}}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stats .card{padding:10px 14px;flex:1;min-width:120px}.stats b{display:block;font-size:22px}
</script>

<script type="text/plain" id="app-js">
const G=[["SEVENTEEN",["S.COUPS","Jeonghan","Joshua","Jun","Hoshi","Wonwoo","Woozi","THE 8","Mingyu","DK","Seungkwan","Vernon","Dino"]],["ATEEZ",["Hongjoong","Seonghwa","Yunho","Yeosang","San","Mingi","Wooyoung","Jongho"]],["TWS",["Shinyu","Dohoon","Youngjae","Hanjin","Jihoon","Kyungmin"]],["BTS",["RM","Jin","SUGA","j-hope","Jimin","V","Jung Kook"]],["LE SSERAFIM",["Kim Chaewon","Sakura","Huh Yunjin","Kazuha","Hong Eunchae"]],["IVE",["An Yujin","Gaeul","Rei","Jang Wonyoung","Liz","Leeseo"]],["&TEAM",["EJ","K","Fuma","Nicholas","Yuma","Jo","Harua","Taki","Maki"]],["izna",["Mai","Bang Jeemin","Koko","Yoon Jiyoon","Choi Jungeun","Jeong Saebi","Ryu Sarang"]],["ZEROBASEONE",["Sung Hanbin","Kim Jiwoong","Zhang Hao","Seok Matthew","Kim Taerae","Ricky","Kim Gyuvin","Park Gunwook","Han Yujin"]],["KISS OF LIFE",["Natty","Julie","Belle","Haneul"]],["TOMORROW X TOGETHER",["Yeonjun","Soobin","Beomgyu","Taehyun","Huening Kai"]],["Red Velvet",["Irene","Seulgi","Wendy","Joy","Yeri"]],["CORTIS",["Martin","James","Juhoon","Seonghyeon","Keonho"]],["Hearts2Hearts",["Jiwoo","Carmen","Yuha","Stella","Juun","A-na","Ian","Ye-on"]],["ITZY",["Yeji","Lia","Ryujin","Chaeryeong","Yuna"]],["BLACKPINK",["Jisoo","Jennie","Rosé","Lisa"]],["aespa",["Karina","Giselle","Winter","Ningning"]],["ILLIT",["Yunah","Minju","Moka","Wonhee","Iroha"]],["KATSEYE",["Sophia","Lara","Daniela","Megan","Manon","Yoonchae"]],["GIRLSET",["Lexie","Savannah","Camila","Kendall"]],["XLOV",["Wumuti","Rui","Hyun","Haru"]]]
  .map(([name,members])=>({name,members})).sort((a,b)=>a.name.localeCompare(b.name,"en",{sensitivity:"base"}));
const TOTAL=G.reduce((n,g)=>n+g.members.length,0);
const S={q:"",open:new Set(),sel:null};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const hl=s=>{if(!S.q)return esc(s);const i=norm(s).indexOf(norm(S.q));return i<0?esc(s):esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+S.q.length))+"</mark>"+esc(s.slice(i+S.q.length))};
const hit=g=>!S.q||norm(g.name).includes(norm(S.q))||g.members.some(m=>norm(m).includes(norm(S.q)));
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
const nav='<nav class="nav"><span class="logo" aria-hidden="true"></span><a href="#">Dashboard</a><a href="#" aria-current="page">Groups</a></nav>';
const head=(extra="")=>'<div><h1 class="title">Groups</h1><p class="sub">'+G.length+' groups, '+TOTAL+' members. Members are in official line order.</p></div>'+extra;
const search='<input class="search" type="search" data-q placeholder="Search groups or members" aria-label="Search groups or members" value="'+esc(S.q)+'">';
const letter=n=>{const c=n[0].toUpperCase();return /[A-Z]/.test(c)?c:"#"};

function A(){const list=G.filter(hit);
  return head(search)+(list.length?'<div class="gridA">'+list.map(g=>'<section class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h2 style="font-size:16px;font-weight:600">'+hl(g.name)+'</h2><span class="mf xs">'+plural(g.members.length,"member")+'</span></div><ol class="chips">'+g.members.map((m,i)=>'<li class="chip"><i>'+(i+1)+'</i>'+hl(m)+'</li>').join("")+'</ol></section>').join("")+'</div>':'<p class="empty">No groups or members match "'+esc(S.q)+'".</p>')}

function B(){const list=G.filter(hit);
  return head(search)+'<div class="card" style="padding:4px 12px"><div class="acc">'+(list.length?list.map(g=>{const o=S.open.has(g.name)||(S.q&&g.members.some(m=>norm(m).includes(norm(S.q))));
    return '<div class="'+(o?"open":"")+'"><button class="row" data-toggle="'+esc(g.name)+'" aria-expanded="'+!!o+'"><b>'+hl(g.name)+'</b><span class="mf sm">'+plural(g.members.length,"member")+' <span class="caret">&#9656;</span></span></button>'+(o?'<ol>'+g.members.map((m,i)=>'<li><span>'+(i+1)+'</span>'+hl(m)+'</li>').join("")+'</ol>':"")+'</div>'}).join(""):'<p class="empty">No groups or members match "'+esc(S.q)+'".</p>')+'</div></div>'}

function C(){const list=G.filter(hit);const wide=innerWidth>=768;let sel=S.sel;if(wide&&!sel)sel=list[0]&&list[0].name;const g=G.find(x=>x.name===sel);
  const left='<div class="card" style="padding:8px">'+search.replace('max-width:360px','')+'<div class="glist" style="margin-top:8px">'+list.map(x=>'<button data-sel="'+esc(x.name)+'" aria-pressed="'+(x.name===sel)+'">'+hl(x.name)+'<span>'+x.members.length+'</span></button>').join("")+'</div></div>';
  const right=g?'<div class="card detail"><button class="back" data-sel="">&larr; All groups</button><h2 style="font-size:20px;font-weight:700">'+esc(g.name)+'</h2><p class="mf sm">'+plural(g.members.length,"member")+'</p><ol>'+g.members.map((m,i)=>'<li><span>'+(i+1)+(i===0?" · First in line":"")+'</span>'+hl(m)+'</li>').join("")+'</ol></div>':"";
  return head()+'<div class="split">'+(wide||!g?left:"")+(g?right:"")+'</div>'}

function D(){const list=G.filter(hit);const letters=[...new Set(G.map(g=>letter(g.name)))];let last="",rows="";
  list.forEach(g=>{const l=letter(g.name);if(l!==last){rows+='<tr class="letter" id="L'+l+'"><td colspan="3">'+l+'</td></tr>';last=l}
    rows+='<tr class="g"><td class="n">'+hl(g.name)+'</td><td>'+g.members.map(hl).join(", ")+'</td><td class="c">'+g.members.length+'</td></tr>'});
  return head('<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">'+search+'<nav class="jump" aria-label="Jump to letter">'+letters.map(l=>'<a href="#L'+l+'">'+l+'</a>').join("")+'</nav></div>')+
    (list.length?'<div class="card" style="padding:4px 12px"><table class="tbl"><thead><tr><th>Group</th><th>Members in line order</th><th style="text-align:right">Count</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="empty">No groups or members match "'+esc(S.q)+'".</p>')}

function E(){const list=G.filter(hit);const big=[...G].sort((a,b)=>b.members.length-a.members.length)[0];
  return head()+'<div class="stats"><div class="card"><span class="mf xs">Groups</span><b>'+G.length+'</b></div><div class="card"><span class="mf xs">Members</span><b>'+TOTAL+'</b></div><div class="card"><span class="mf xs">Largest</span><b>'+esc(big.name)+'</b><span class="mf xs">'+big.members.length+' members</span></div></div>'+search+
    (list.length?list.map(g=>'<section class="sec"><h2>'+hl(g.name)+'<span class="mf xs" style="font-weight:400">'+plural(g.members.length,"member")+'</span></h2><ol class="lineup">'+g.members.map((m,i)=>'<li><span class="av" aria-hidden="true">'+esc(m.replace(/^[^A-Za-z0-9]+/,"")[0]||"?").toUpperCase()+'</span><span class="pos">No. '+(i+1)+'</span><span class="nm">'+hl(m)+'</span></li>').join("")+'</ol></section>').join(""):'<p class="empty">No groups or members match "'+esc(S.q)+'".</p>')}

const V={A,B,C,D,E};
function render(){const f=document.activeElement&&document.activeElement.matches("[data-q]");const pos=f?document.activeElement.selectionStart:0;
  document.body.innerHTML=nav+'<main class="page">'+V[OPT]()+'</main>';
  if(f){const i=document.querySelector("[data-q]");i.focus();i.setSelectionRange(pos,pos)}}
document.addEventListener("input",e=>{if(e.target.matches("[data-q]")){S.q=e.target.value.trim();render()}});
document.addEventListener("click",e=>{const t=e.target.closest("[data-toggle],[data-sel],a[href^='#L']");if(!t)return;
  if(t.dataset.toggle!==undefined){const n=t.dataset.toggle;S.open.has(n)?S.open.delete(n):S.open.add(n);render()}
  else if(t.dataset.sel!==undefined){S.sel=t.dataset.sel||null;render();scrollTo(0,0)}
  else{e.preventDefault();const el=document.getElementById(t.getAttribute("href").slice(1));if(el)el.scrollIntoView()}});
addEventListener("resize",render);
render();
</script>

<script>
const CHOSEN = { option: "E", date: "2026-11-23" };
const OPTIONS = [
  { key: "A", name: "Card grid with chips", note: "Every group is a card with its member count and members as numbered chips, 1 column on phones, 2 on tablets, 3 on desktop. One search box matches group or member names and highlights the match. Everything is visible at once." },
  { key: "B", name: "Accordion list", note: "One row per group with its member count, collapsed by default so the whole list fits on a phone screen. Tap a row to show the numbered line-up. Searching for a member opens the groups they're in." },
  { key: "C", name: "List and detail", note: "Group list with counts on the left, the selected group's line-up as numbered tiles on the right. On phones the list comes first and tapping a group opens its line-up with a back button. Closest to a future per-group page." },
  { key: "D", name: "Dense table", note: "One table row per group: name, members in line order as a comma list, and the count. Letter headings with a jump bar. Most compact on desktop. On phones each row stacks into a block and the header row is hidden." },
  { key: "E", name: "Line-up strips", note: "Summary tiles (groups, members, largest group), then a section per group with each member as a small tile with an initial and position. Strips scroll sideways on phones and wrap on desktop. Leaves room for photos later." },
];

const $ = (id) => document.getElementById(id);
let cur = "A", size = { w: 390, h: 844 };
try { const s = JSON.parse(localStorage.getItem("ui-opt-size") || "null"); if (s) size = s; } catch (e) {}
const [hOpt, hSize] = location.hash.slice(1).split("/");
if (OPTIONS.some((o) => o.key === hOpt)) cur = hOpt;
if (hSize === "desktop") size = { w: 1280, h: 800 }; else if (hSize === "phone") size = { w: 390, h: 844 };
$("status").textContent = CHOSEN ? "Chosen: " + CHOSEN.option + " · " + CHOSEN.date : "Not chosen yet";
if (CHOSEN) $("status").classList.add("done");
OPTIONS.forEach((o) => {
  const b = document.createElement("button");
  b.dataset.k = o.key;
  b.innerHTML = o.key + " · " + o.name + (CHOSEN && CHOSEN.option === o.key ? '<span class="badge">Chosen</span>' : "");
  b.onclick = () => { cur = o.key; render(); };
  $("tabs").appendChild(b);
});
document.querySelectorAll("#sizes button").forEach((b) => b.onclick = () => {
  size = { w: +b.dataset.w, h: +b.dataset.h };
  try { localStorage.setItem("ui-opt-size", JSON.stringify(size)); } catch (e) {}
  render();
});
function fit() {
  const s = Math.min(1, $("stage").clientWidth / size.w), f = $("view");
  f.style.width = size.w + "px"; f.style.height = size.h + "px"; f.style.transform = "scale(" + s + ")";
  $("frame").style.width = size.w * s + "px"; $("frame").style.height = size.h * s + "px";
  $("dims").textContent = size.w + " x " + size.h + (s < 1 ? " (shown at " + Math.round(s * 100) + "%)" : "");
}
function render() {
  const o = OPTIONS.find((x) => x.key === cur);
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.k === cur));
  document.querySelectorAll("#sizes button").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.w === size.w));
  $("note").innerHTML = "<p><b>" + o.key + " · " + o.name + ".</b> " + o.note + "</p>";
  $("view").srcdoc = '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' +
    $("app-css").textContent + '</style></head><body><script>const OPT="' + cur + '";' +
    $("app-js").textContent + "<\/script></body></html>";
  fit();
}
addEventListener("resize", fit);
render();
</script></body></html>
